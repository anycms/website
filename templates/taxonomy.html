{% extends "base.html" %}
{% block title %}{{ taxonomy.name }} · {{ config.title }}{% endblock %}

{% block content %}
<header class="page-head">
  <div class="page-head-inner">
    <span class="eyebrow">分类法</span>
    <h1>{{ taxonomy.name }}</h1>
  </div>
</header>
<section class="listing">
  <ul class="term-list">
    {% for term in taxonomy.terms %}
    <li><a href="{{ term.url | safe }}">{{ term.name }}</a> <span class="count">{{ term.count }}</span></li>
    {% endfor %}
  </ul>
</section>
{% endblock %}
